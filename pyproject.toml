[project]
name = "theseus-kit"
version = "0.1.0"
description = "MCP server for safely inspecting, editing, templating, and publishing TFRobot configurations"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [{ name = "A2C-SMCP contributors" }]
keywords = ["mcp", "a2c-smcp", "agent", "configuration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "mcp>=1.15.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "tfrs-auth[httpx]>=0.2.1,<1.0.0",
]

[project.urls]
Repository = "https://github.com/A2C-SMCP/theseus-kit"
Issues = "https://github.com/A2C-SMCP/theseus-kit/issues"

[project.scripts]
theseus-kit = "theseus_kit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3.0.0",
    "poethepoet>=0.37.0,<1.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.0,<1.0.0",
]
test = [
    "pytest-cov>=6.2.0,<8.0.0",
]
build = [
    "bump-my-version>=1.2.0,<2.0.0",
    "packaging>=25.0,<27.0",
    "twine>=7.0.0,<8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/theseus_kit"]

[tool.hatch.build.targets.sdist]
exclude = ["/.gitignore"]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.poe.tasks]
format = "ruff format src tests scripts"
format-check = "ruff format --check src tests scripts"
lint = "ruff check src tests scripts"
typecheck = "mypy src scripts tests"
test = "pytest"
test-cov = "pytest --cov=theseus_kit --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
lock-check = "uv lock --check"
build = "uv build"
package-check = "twine check dist/*.whl dist/*.tar.gz"
version-show = "bump-my-version show current_version"

[tool.poe.tasks.check]
sequence = ["format-check", "lint", "typecheck"]

[tool.poe.tasks.ci]
sequence = ["lock-check", "check", "test-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--tb=short"]
markers = [
    "e2e: end-to-end test against a real (near-prod) robot; skipped unless THESEUS_E2E=1 plus THESEUS_* settings are present",
]

[tool.coverage.run]
source = ["theseus_kit"]
omit = ["src/theseus_kit/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"


[tool.ruff.lint.per-file-ignores]
"src/theseus_kit/skills/_*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
